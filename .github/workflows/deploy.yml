# Build once, deploy that exact build.
#
# The images are the artifact: they are built here, tagged with the commit
# they came from, pushed to GHCR, and the server only pulls them.
#
# Rolling back is setting TAG to an older commit and running `up -d`.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Shared with undeploy, so the two never run over each other.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  backend:
    name: Build and publish backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Runs the tests too: a commit that fails them never gets an image.
      - name: Build and test
        run: ./gradlew :build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^ *version = "\(.*\)"$/\1/p' build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/backend:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  admin-ui:
    name: Build and publish admin UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Type check
        working-directory: admin-ui
        run: npm ci && npx tsc --noEmit

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^ *version = "\(.*\)"$/\1/p' build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: admin-ui
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/admin-ui:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/admin-ui:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/admin-ui:latest
          cache-from: type=gha,scope=admin-ui
          cache-to: type=gha,scope=admin-ui,mode=max

  deploy:
    name: Deploy
    needs: [backend, admin-ui]
    runs-on: ubuntu-latest
    # Build and publish only until a deploy host is configured
    if: ${{ vars.DEPLOY_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Authorise
        uses: ./.github/actions/ssh-setup
        with:
          key: ${{ secrets.DEPLOY_KEY }}
          host: ${{ vars.DEPLOY_HOST }}
          host-key: ${{ vars.DEPLOY_HOST_KEY }}
          user: ${{ vars.DEPLOY_USER }}

      # One connection for the whole deploy; the files travel through the same
      # pipe as a tar stream.
      #
      # `.env` and `application.yml` are not in the archive (they are not in
      # git), so the server's own copies survive; only the TAG line is
      # rewritten.
      - name: Ship and restart
        env:
          DIR: ${{ vars.DEPLOY_PATH }}
          TAG: ${{ github.sha }}
        run: |
          tar -C deployment -czf - . | ssh deploy-target "
            set -eu
            mkdir -p '$DIR'
            tar -C '$DIR' -xzf -
            cd '$DIR'
            touch .env
            sed -i '/^TAG=/d' .env
            echo 'TAG=$TAG' >> .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          "
